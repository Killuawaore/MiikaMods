name: Publicar acesso

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "access/usuarios.txt"
      - "access/public-key.txt"
      - "tools/build_manifest.py"
      - ".github/workflows/publicar-acesso.yml"
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar assinatura Ed25519
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4

      - name: Gerar manifesto assinado
        env:
          RUNTIME_PROFILE_KEY: ${{ secrets.RUNTIME_PROFILE_KEY }}
        run: python tools/build_manifest.py

      - name: Publicar manifesto
        run: |
          if git diff --quiet -- access/manifest.json; then
            echo "Nenhuma alteracao para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add access/manifest.json
          git commit -m "Atualizar manifesto de acesso [skip ci]"
          git push
